``<!-- Reusable Confirmation Modal (data-confirm-url pattern) -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="confirmModalLabel">
          <i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>
          <span id="confirmModalTitle">Confirm Action</span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body py-3" id="confirmModalBody">
        Are you sure you want to proceed? This action cannot be undone.
      </div>
      <div class="modal-footer border-top-0 pt-0 gap-2">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">
          <i class="bi bi-x-lg me-1"></i>Cancel
        </button>
        <form id="confirmModalForm" method="post" class="d-inline m-0">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-check-lg me-1"></i>
            <span id="confirmModalBtnText">Confirm</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
