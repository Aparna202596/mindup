{% load static %}
<nav class="navbar">
  <div class="container navbar-inner">
    <a href="{% url 'home' %}" class="navbar-brand">MindUp</a>

    <form class="navbar-search" method="get" action="{% url 'search' %}">
      <input type="search" name="q" placeholder="Search..." value="{{ request.GET.q|default:'' }}">
    </form>

    <ul class="navbar-nav">
      <li><a href="{% url 'topic-list' %}">Topics</a></li>
      <li><a href="{% url 'question-list' %}">Questions</a></li>
      {% if user.is_authenticated %}
        <li><a href="{% url 'question-create' %}">Ask</a></li>
        <li><a href="{% url 'pdf-upload' %}">Upload</a></li>
        <li><a href="{% url 'user-dashboard' %}">Dashboard</a></li>
        {% if user.is_staff %}
          <li><a href="{% url 'admin-dashboard' %}">Admin</a></li>
        {% endif %}
        <li><a href="{% url 'account_logout' %}">Logout</a></li>
      {% else %}
        <li><a href="{% url 'account_login' %}" class="btn-login">Sign in with Google</a></li>
      {% endif %}
    </ul>
  </div>
</nav>
