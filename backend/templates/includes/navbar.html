{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="{% url 'home' %}">
      <i class="bi bi-brain me-1"></i>MindUp
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <!-- Search -->
      <form class="d-flex mx-auto" style="max-width:380px; width:100%;"
            method="get" action="{% url 'search' %}">
        <div class="input-group">
          <input class="form-control form-control-sm" type="search" name="q"
                 placeholder="Search questions, topics…"
                 value="{{ request.GET.q|default:'' }}" autocomplete="off">
          <button class="btn btn-outline-secondary btn-sm" type="submit">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </form>
      <!-- Nav links -->
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'topic-list' %}">
            <i class="bi bi-journals me-1"></i>Topics
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'question-list' %}">
            <i class="bi bi-question-circle me-1"></i>Questions
          </a>
        </li>
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'question-create' %}">
              <i class="bi bi-plus-circle me-1"></i>Ask
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'bulk-qa-upload' %}">
              <i class="bi bi-cloud-upload me-1"></i>Bulk Upload
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link position-relative" href="{% url 'user-dashboard' %}">
              <i class="bi bi-speedometer2 me-1"></i>Dashboard
            </a>
          </li>
          {% if user.is_staff %}
            <li class="nav-item">
              <a class="nav-link text-warning fw-semibold" href="{% url 'admin-dashboard' %}">
                <i class="bi bi-shield-check me-1"></i>Admin
              </a>
            </li>
          {% endif %}
          <li class="nav-item">
            <a class="nav-link text-danger" href="{% url 'account_logout' %}">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
          </li>
        {% else %}
          <li class="nav-item ms-2">
            <a class="btn btn-primary btn-sm" href="{% url 'account_login' %}">
              <i class="bi bi-google me-1"></i>Sign In
            </a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
