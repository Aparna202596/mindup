{% load static socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sign In — MindUp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root { --brand:#4f46e5; --brand-dark:#3730a3; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0e17;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative;
    }
    .blob {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.18;
      animation: drift 12s ease-in-out infinite; pointer-events: none;
    }
    .blob-1 { width:600px; height:600px; background:#4f46e5; top:-200px; left:-150px; animation-delay:0s; }
    .blob-2 { width:400px; height:400px; background:#7c3aed; bottom:-100px; right:-100px; animation-delay:-4s; }
    .blob-3 { width:300px; height:300px; background:#2563eb; top:40%; left:60%; animation-delay:-8s; }
    @keyframes drift {
      0%,100% { transform:translate(0,0) scale(1); }
      33%     { transform:translate(30px,-20px) scale(1.05); }
      66%     { transform:translate(-20px,15px) scale(0.95); }
    }
    .login-card {
      position: relative; z-index: 10;
      width: 100%; max-width: 400px; margin: 1rem;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 2.75rem 2rem 2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; opacity: 0;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .brand-logo { text-align:center; margin-bottom:2.25rem; }
    .brand-logo .icon {
      font-size:3rem; color:var(--brand); display:block; margin-bottom:0.625rem;
      filter:drop-shadow(0 0 22px rgba(79,70,229,0.65));
    }
    .brand-logo h1 {
      font-size:1.875rem; font-weight:800; color:#fff;
      letter-spacing:-0.04em; margin:0 0 0.25rem; line-height:1;
    }
    .brand-logo p { color:rgba(255,255,255,0.45); font-size:0.875rem; margin:0; }
    .sign-in-prompt {
      text-align:center; color:rgba(255,255,255,0.5);
      font-size:0.875rem; margin-bottom:1.25rem;
    }
    .btn-google {
      width:100%; display:flex; align-items:center; justify-content:center; gap:0.75rem;
      padding:0.8rem 1.25rem;
      background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.2);
      border-radius:12px; color:#fff; font-weight:600; font-size:0.9375rem;
      text-decoration:none;
      transition:background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-google:hover {
      background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.35);
      color:#fff; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.3);
    }
    .btn-google:active { transform:translateY(0); box-shadow:none; }
    .btn-google svg { flex-shrink:0; }
    .alert-custom {
      display:flex; align-items:flex-start; gap:0.5rem;
      background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3);
      border-radius:10px; color:#fca5a5;
      padding:0.75rem 1rem; font-size:0.875rem; margin-bottom:1.25rem;
    }
    .alert-info-custom {
      background:rgba(79,70,229,0.15); border-color:rgba(79,70,229,0.3);
      color:rgba(255,255,255,0.75);
    }
    .footer-note {
      text-align:center; color:rgba(255,255,255,0.25);
      font-size:0.75rem; margin-top:1.75rem; line-height:1.6;
    }
    .footer-note a { color:rgba(255,255,255,0.45); text-decoration:none; }
    .footer-note a:hover { color:#fff; }
    .back-link {
      display:flex; align-items:center; justify-content:center; gap:0.375rem;
      margin-top:1.25rem; color:rgba(255,255,255,0.35);
      font-size:0.8125rem; text-decoration:none; transition:color 0.15s;
    }
    .back-link:hover { color:rgba(255,255,255,0.7); }
    @media (max-width:480px) {
      .login-card { padding:2rem 1.25rem 1.5rem; margin:0.75rem; }
      .brand-logo { margin-bottom:1.75rem; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>

  <main class="login-card" role="main">
    <div class="brand-logo">
      <i class="bi bi-brain icon" aria-hidden="true"></i>
      <h1>MindUp</h1>
      <p>Your team's knowledge base</p>
    </div>

    {% if messages %}
      {% for msg in messages %}
      <div class="alert-custom {% if 'info' in msg.tags %}alert-info-custom{% endif %}" role="alert">
        <i class="bi bi-{% if 'info' in msg.tags %}info-circle{% else %}exclamation-circle{% endif %} flex-shrink-0 mt-1" aria-hidden="true"></i>
        <span>{{ msg }}</span>
      </div>
      {% endfor %}
    {% endif %}

    <p class="sign-in-prompt">Sign in to continue</p>

    <a href="{% provider_login_url 'google' process='login' %}"
       class="btn-google"
       aria-label="Sign in with Google">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <p class="footer-note">
      By signing in you agree to MindUp's <a href="#">terms of service</a>.
    </p>
    <a href="{% url 'home' %}" class="back-link">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>Back to MindUp
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
